<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Seite nicht gefunden – Rontano</title>
    <link rel="icon" href="/images/favicon_e_gitarre_32px.ico" type="image/x-icon">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background-color: #212121;
            color: #f8f8f8;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            line-height: 1.6;
            text-align: center;
        }

        .logo {
            font-family: Impact, 'Arial Black', sans-serif;

        }

        h1 {
            font-size: 5rem;
            line-height: 1.1;
            margin: 16px 0 8px;
        }

        p {
            max-width: 420px;
            margin: 0 auto 28px;
            color: #bbb;
        }

        a {
            display: inline-block;
            background-color: #d32f2f;
            color: white;
            padding: 12px 30px;
            border-radius: 4px;
            text-transform: uppercase;
            text-decoration: none;
            font-weight: bold;
            letter-spacing: 1px;
        }

        a:hover,
        a:focus {
            background-color: #ffc107;
            color: #212121;
        }
    </style>
</head>
